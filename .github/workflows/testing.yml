name: Milestone 4 - Testing & Refactoring CI
on:
  push:
    branches: [ ispw-project ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build OpenJPA
        run: |
          mvn -B clean install \
          -Dmaven.test.skip=true \
          -Dinvoker.skip=true \
          -Dcheckstyle.skip=true \
          -Drat.skip=true

      - name: Run LRUMap tests
        run: |
          mvn -B -pl :openjpa-lib test \
          -Dtest=*Test,!*_ESTest \
          -Dcheckstyle.skip=true \
          -Drat.skip=true

      - name: Generate JaCoCo report
        if: always()
        run: |
          mvn -pl :openjpa-lib jacoco:report

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: openjpa-lib/target/site/jacoco/
